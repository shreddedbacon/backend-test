server {

    listen 8080 default_server;

    include /etc/nginx/helpers/*.conf;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /cms {
        try_files /cms.html =404;
    }

    location = /api {
        try_files /api.html =404;
    }
}